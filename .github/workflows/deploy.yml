name: Pubblica su GitHub Pages

# Pages non può servire i sorgenti, quindi il workflow compila e pubblica il
# contenuto di dist/ sul branch `gh-pages`, che è la sorgente configurata per
# Pages. Non usa l'API di deploy di Pages: quella richiede la sorgente
# «GitHub Actions», e con essa una pubblicazione manuale dal locale non sarebbe
# più possibile.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pubblica dist/ su gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build da ${GITHUB_SHA::7}"
          git push -q -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
